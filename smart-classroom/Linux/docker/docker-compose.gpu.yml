# GPU / NPU passthrough override.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.gpu.yml up -d --build
#
# Set RENDER_GID in .env so the container user can access /dev/dri:
#   echo "RENDER_GID=$(getent group render | cut -d: -f3)" >> .env
#
# The app always uses GPU for Content Search reranking. This override enables
# GPU/NPU passthrough for the other accelerator-enabled services.

services:
  ovms:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${RENDER_GID}"
  model-downloader:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${RENDER_GID}"
    volumes:
      - ../components/vlm/config/startup-models.gpu.yaml:/opt/startup-models.yaml:ro

  ovms-provision:
    volumes:
      - ../components/vlm/config/startup-models.gpu.yaml:/opt/startup-models.yaml:ro

  metrics-collector:
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    group_add:
      - "${RENDER_GID}"

  # ASR microservice: map GPU (/dev/dri) and NPU (/dev/accel) so the audio
  # analyzer can run Whisper/diarization on GPU or NPU when its config selects
  # a non-CPU device (config.models.asr.device).
  audio-analyzer:
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    group_add:
      - "${RENDER_GID}"

  # Video Analytics engine: GPU (/dev/dri, VA-API encode/decode) + NPU
  # (/dev/accel) so pose/ReID/classification run on GPU or NPU per the
  # VA_*_DEVICE settings.
  video-analytics:
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    group_add:
      - "${RENDER_GID}"
