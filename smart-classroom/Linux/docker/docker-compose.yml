# Smart Classroom — containerized stack (Linux)

services:
  model-cache-permissions:
    profiles: ["text-gen"]
    image: python:3.12-slim
    container_name: sc-model-cache-permissions
    command: >-
      sh -lc "
        mkdir -p /opt/models/ovms/openvino_models &&
        chown -R 1000:1000 /opt/models &&
        find /opt/models -type d -exec chmod 0775 {} + &&
        find /opt/models -type f -exec chmod 0664 {} +
      "
    volumes:
      - model-cache:/opt/models
    restart: "no"
    networks: [smart-classroom]

  storage-permissions:
    image: python:3.12-slim
    container_name: sc-storage-permissions
    command: >-
      sh -lc "
        mkdir -p /app/storage/smart-classroom &&
        chown -R 10001:10001 /app/storage &&
        find /app/storage -type d -exec chmod 0775 {} + &&
        find /app/storage -type f -exec chmod 0664 {} +
      "
    volumes:
      - storage:/app/storage
    restart: "no"
    networks: [smart-classroom]

  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        # Forward the host proxy (if any) so npm/pip can fetch packages.
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: smart-classroom-app:local
    container_name: smart-classroom-app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    networks: [smart-classroom]
    depends_on:
      storage-permissions: { condition: service_completed_successfully }
      metrics-collector: { condition: service_healthy }
    environment:
      - METRICS_COLLECTOR_URL=http://metrics-collector:9000
      - AUDIO_ANALYZER_URL=http://audio-analyzer:8010
      - SERVING_BASE_URL=${SERVING_BASE_URL:-http://ovms:9000}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-}
    volumes:
      - storage:/app/storage
      - model-cache:/app/models
    # NOTE: no hard `depends_on: ovms` here — `ovms` carries the "text-gen"
    # Compose profile while `app` is unprofiled (always-on), and
    # `docker compose config` errors if an unprofiled service hard-depends on
    # a profile that isn't active (see repo memory: containerization
    # skeleton). SERVING_BASE_URL is treated as optional at runtime instead;
    # the app only calls it when text-gen is enabled in config.yaml.
    # content-search is still out of scope for this pass:
    # depends_on:
    #   content-search: { condition: service_healthy }
    # environment:
    #   - CONTENT_SEARCH_HOST=content-search

  metrics-collector:   # telemetry sidecar: CPU/GPU/NPU/memory/power -> /metrics, /platform-info
    build:
      context: ../performance-tools
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: sc-metrics-collector:local
    container_name: sc-metrics-collector
    # privileged + host /proc,/sys are required by sar/free/qmassa/PCM inside
    # the performance-tools image; this does not require network_mode: host,
    # so the container stays reachable at the DNS name "metrics-collector"
    # from the app service on the bridge network below.
    privileged: true
    environment:
      - RESULTS_DIR=/tmp/results
      - NPU_LOG=/tmp/results/npu_usage.csv
      - METRICS_HTTP_PORT=9000
    volumes:
      - metrics:/tmp/results
      - /sys:/sys:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/class/drm:/sys/class/drm:ro
    ports:
      # Host-published so `curl http://localhost:9100/metrics` works for
      # manual verification without exec-ing into the container.
      - "9100:9000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [smart-classroom]

  audio-analyzer:   
    profiles: ["asr"]
    build:
      context: ../edge-ai-libraries/microservices/audio-analyzer
      dockerfile: docker/Dockerfile
      args:
        INSTALL_CJK: "${INSTALL_CJK:-true}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: smart-classroom-audio-analyzer:local
    container_name: sc-audio-analyzer
    user: "1000:1000"
    environment:
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # ZE_ENABLE_ALT_DRIVERS is required for Intel NPU enumeration (GPU override).
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
      # HF_TOKEN is only needed when the service runs diarization (gated models).
      HF_TOKEN: "${HF_TOKEN:-}"
      AUDIO_ANALYZER_SERVER_PORT: "8010"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    volumes:
      # Editable service config (ASR provider/model/device, diarization).
      - ../edge-ai-libraries/microservices/audio-analyzer/config.yaml:/app/audio_analyzer/config.yaml:ro
      - audio-analyzer-models:/app/audio_analyzer/models
      - audio-analyzer-chunks:/app/audio_analyzer/chunks
      - audio-analyzer-storage:/app/audio_analyzer/storage
      - audio-analyzer-cache:/app/audio_analyzer/.cache
    healthcheck:
      # The port only binds after startup preloads models. First run downloads
      # them (FunASR paraformer-zh ~900MB + VAD/punc, or Whisper) which, on a
      # slow/proxied network, can take far longer than a Whisper GPU warmup —
      # so start_period must cover that one-time download or the container is
      # wrongly flagged unhealthy before it ever serves. Models persist to the
      # audio-analyzer-models volume, so subsequent starts are fast.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      start_period: 1800s
      retries: 5
    restart: unless-stopped
    networks: [smart-classroom]

  model-downloader:  
    profiles: ["text-gen"]
    build:
      context: ../edge-ai-libraries/microservices/model-download
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: sc-model-downloader:local
    container_name: sc-model-downloader
    command: --plugins ${ENABLED_PLUGINS:-huggingface,openvino}
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_PATH=/opt/models
      - ENABLED_PLUGINS=${ENABLED_PLUGINS:-huggingface,openvino}
      - STARTUP_MODELS_CONFIG=/opt/startup-models.yaml
      - OVMS_RELEASE_TAG=${OVMS_RELEASE_TAG:-v2026.3}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - TRANSFORMERS_VERBOSITY=error
      - PYTHONWARNINGS=ignore
      - HF_HUB_DISABLE_PROGRESS_BARS=1
      - TQDM_DISABLE=1
    volumes:
      - model-cache:/opt/models
      - ../components/vlm/config/startup-models.yaml:/opt/startup-models.yaml:ro
    depends_on:
      model-cache-permissions: { condition: service_completed_successfully }
    ports:
      - "8200:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 1800s
      retries: 5
    restart: unless-stopped
    networks: [smart-classroom]

  ovms-provision:
    profiles: ["text-gen"]
    build:
      context: ..
      dockerfile: docker/ovms-provision.Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: sc-ovms-provision:local
    container_name: sc-ovms-provision
    environment:
      - OVMS_MODELS_ROOT=/opt/models/ovms
      - STARTUP_MODELS_CONFIG=/opt/startup-models.yaml
    volumes:
      - model-cache:/opt/models
      - ../components/vlm/config/startup-models.yaml:/opt/startup-models.yaml:ro
    depends_on:
      model-cache-permissions: { condition: service_completed_successfully }
      model-downloader: { condition: service_healthy }
    restart: "no"
    networks: [smart-classroom]

  ovms:               # OpenVINO Model Server (:9000, internal only)
    profiles: ["text-gen"]
    image: openvino/model_server:2026.3-gpu
    container_name: sc-ovms
    command: >-
      --rest_port 9000 --config_path /models/ovms/config.json
    volumes:
      - model-cache:/models:ro
    shm_size: "2gb"
    depends_on:
      model-downloader: { condition: service_healthy }
      ovms-provision: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 12
    restart: unless-stopped
    networks: [smart-classroom]

  # content-search:     # RAG / multimodal backend (:9011, internal only)
  #   profiles: ["content-search"]
  #   build:
  #     context: .
  #     dockerfile: docker/content-search.Dockerfile
  #   depends_on:
  #     ovms: { condition: service_healthy }
  #   restart: unless-stopped
  #   networks: [smart-classroom]

networks:
  smart-classroom:
    driver: bridge

volumes:
  model-cache:
  storage:
  metrics:
  audio-analyzer-models:
  audio-analyzer-chunks:
  audio-analyzer-storage:
  audio-analyzer-cache:
