#
# GPU overlay startup model-download config, mounted instead of
# startup-models.yaml when docker/docker-compose.gpu.yml is applied
# (Intel GPU render node detected). Kept in sync with config.yaml by
# utils/sync_startup_models.py (name/precision/device fields).

download_path: ovms
parallel_downloads: false
models:
- name: Qwen/Qwen3-VL-8B-Instruct
  hub: openvino
  type: vlm
  is_ovms: true
  config:
    precision: int4
    device: GPU
    cache_size: 4
- name: BAAI/bge-large-en-v1.5
  hub: openvino
  type: embeddings
  is_ovms: true
  config:
    device: CPU
- name: BAAI/bge-reranker-base
  hub: openvino
  type: rerank
  is_ovms: true
  config:
    device: CPU
