#
# Qwen3-VL-8B-Instruct (the application's default text_gen model) INT4: one plain paged
# baseline, no speculative decoding. Text-only: the VLM export is driven through VLMPipeline
# with text prompts; image handling is not measured.
#
#   .\components\context_bench\run_benchmark.ps1 --config components/context_bench/config_qwen3_8b.yaml
#   ... --list-profiles                       # the plan below; loads nothing
#   ... --contexts 8000 --throughput-task chat
#   ... --pipeline-config KV_CACHE_PRECISION=  # the plugin's default KV precision
#   ... --weight-format int8                   # the INT8 artifact
#   ... --accuracy
#   ... --throughput-task classroom_summary --output-tokens 1024       # the app's own request
#
# TEST STEPS. Every case below is one child process: load the model, run the warm-up(s), then
# the measured generations, while RAM/GPU memory are sampled. IDs follow execution order, row
# by row. CLI filters (--profiles, --contexts, --throughput-task) renumber the steps;
# --list-profiles prints the exact plan, with its IDs, before anything loads.
#
# Throughput run (default): 7 cases, each 1 warm-up + 3 measured generations of up to 512
# tokens (EOS respected), 30 s idle before each measured one.
#
#   Context           Task       | paged_min
#   none (task only)  code       | c01
#   none (task only)  math       | c02
#   none (task only)  chat       | c03
#   8,000 tokens      code       | c04
#   8,000 tokens      math       | c05
#   8,000 tokens      chat       | c06
#   8,000 tokens      summary_2s | c07
#
#   Context   none: the task prompt alone; 8,000 tokens: a synthetic classroom transcript,
#             then the task, 8,000 rendered tokens in total.
#   Task      code       a Python module with tests (HumanEval-like)
#             math       six worked physics/arithmetic/algebra problems (GSM8K-like)
#             chat       eight open-ended assistant requests (MT-Bench-like)
#             summary_2s two-sentence summary of the transcript (~45 tokens; transcript only)
#   Profile   paged_min  no speculation: the plain paged pipeline
# Each (context, task) row gets its own speed table.
#
# Accuracy run (--accuracy): 1 case replaces the throughput cases, one per profile at each
# context with a transcript (context 0 has nowhere to plant a fact):
#
#   Context       Task     | paged_min
#   8,000 tokens  accuracy | c01
#
#   accuracy  1 warm-up + 32 probes (`accuracy` below): 28 RULER retrieval probes scored
#             against planted ground truth, and 4 generation probes (summary, fact_sheet)
#             scored against paged_min's answer to the identical prompt.
#
# Artifacts (prepared by the serving workflow, never downloaded here) are derived from
# `models_base_path` and the weight format, so --weight-format selects the target:
#   models/openvino/Qwen3-VL-8B-Instruct/int4   (OpenVINO/Qwen3-VL-8B-Instruct-int4-ov)   default
#   models/openvino/Qwen3-VL-8B-Instruct/int8   (OpenVINO/Qwen3-VL-8B-Instruct-int8-ov)   --weight-format int8
# Results of both go under output_dir; each report's header names the weights it ran.
#
# KV_CACHE_PRECISION stays f16 so the baseline matches the other configs;
# --pipeline-config KV_CACHE_PRECISION= drops it to the plugin default.
#
# Qwen3-VL-8B is a dense full-attention model (36 layers, 8 KV heads), so the KV estimate needs
# no linear-attention state and the Instruct chat template has no thinking mode to disable.

model:
  provider: openvino
  device: GPU
  weight_format: int4
  models_base_path: models

benchmark:
  models: [Qwen3-VL-8B-Instruct]
  # 0 = no transcript: code/math/chat run as standalone prompts; the summaries and the
  # accuracy suites skip it. Positive values are the total rendered input-token target.
  context_tokens: [0, 8000]
  # Decode ceiling for every throughput task and the warm-up; EOS is respected. 512 lets
  # math/code answers run past the first decode pass's one-time cost.
  output_tokens: 512
  warmup: 1
  iterations: 3
  # Untimed idle before each measured generation: the iGPU boosts after idle, so 30 s
  # reports what an occasional classroom request sees (burst). --iteration-gap 0 measures
  # sustained load.
  iteration_gap_sec: 30
  # The reference's four domains, as in config_qwen3.6_35b.yaml. classroom_summary (the
  # application's summarizer request) is left out: at 512 tokens its long Markdown answer is
  # cut off, so run it on its own with --output-tokens 1024 (see the usage lines above).
  throughput_task: [code, math, chat, summary_2s]
  timeout_sec: 5400
  max_system_memory_pct: 100
  gpu_memory_budget_gb: 59
  cache_dir: null
  output_dir: monitoring/executionlogs/context_bench/qwen3_8b

# Read only with --accuracy; identical to the reference configuration.
accuracy:
  suites: [retrieval, generation]
  baseline_profile: paged_min
  seed: 20260917
  embedding_model: sentence-transformers/all-mpnet-base-v2
  retrieval:
    tasks: [niah_single, niah_multikey, niah_multivalue, niah_multiquery, vt, cwe, fwe, qa]
    depths: [0.0, 0.5, 1.0]
    samples: 2
    output_tokens: 64
    options:
      niah_multikey: {num_distractors: 3}
      niah_multivalue: {num_values: 4}
      niah_multiquery: {num_queries: 4}
      vt: {chain_length: 3, num_chains: 3}
      cwe: {num_target_words: 10}
      fwe: {top_k: 3}
  generation:
    tasks: [summary, fact_sheet]
    depths: [0.5]
    samples: 2
    output_tokens: 256
    options:
      fact_sheet: {num_facts: 6}

# max_num_batched_tokens is explicit (the SchedulerConfig default of 256 would chunk the
# prefill); prefix caching stays off so repeated prompts never reuse the warm-up's prefix.
profiles:
  - name: paged_min
    ov: &ov_qwen3_8b
      GPU_ENABLE_LARGE_ALLOCATIONS: "YES"
      KV_CACHE_PRECISION: f16
    scheduler: &scheduler_qwen3_8b
      max_num_batched_tokens: 65536
      max_num_seqs: 1
      enable_prefix_caching: false
