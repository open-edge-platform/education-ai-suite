appId: com.intel.openedgeplatform.educationaisuite.smartclassroom
productName: Smart Classroom
directories:
  output: release
# Bundle the built UI + the additive electron layer. Production `dependencies`
# (express, http-proxy-middleware) are picked up automatically by electron-builder.
files:
  - dist/**/*
  - electron/**/*
  - package.json

# The installer ships the whole Windows source root as an `extraResource`, so
# the in-app Setup flow can lay down the Python env / models on the client from
# `resources/backend` (which becomes the backend `home` via SMART_CLASSROOM_HOME).
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Smart Classroom
  artifactName: SmartClassroom-${version}-setup.exe
extraResources:
  - from: ..
    to: backend
    filter:
      - '**/*'
      # build/dependency/monitoring artifacts never belong in the shipped source:
      - '!**/node_modules/**'
      - '!**/dist/**'
      - '!**/release/**'
      - '!**/logs/**'
      - '!**/.git/**'
      - '!**/__pycache__/**'
      - '!**/*.py[cod]'
      - '!**/.env'
      - '!**/venv_convert/**'
      - '!**/.pytest_cache/**'
      # vendor telemetry toolchain is too large and not needed at runtime:
      - '!**/monitoring/tools/socwatch_windows_v2026.0/**'